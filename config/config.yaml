# CIFAR-10 Classification Configuration

data:
  train_size: 8000
  val_size: 2000
  batch_size: 32
  random_seed: 42

model:
  base_model: "ResNet50"
  input_shape: [32, 32, 3]
  num_classes: 10
  dropout_rate: 0.3
  dense_units: 256

training:
  phase1:
    epochs: 20
    learning_rate: 0.001
  phase2:
    epochs: 30
    learning_rate: 0.0001
    unfreeze_from: "conv5_block1"

mlflow:
  experiment_name: "cifar10-classification"
